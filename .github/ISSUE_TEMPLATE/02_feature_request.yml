---
name: 💡 Feature request
description: "Suggest a new command, option or improvement for the Umbraco CLI."
labels: ["type/feature", "state/needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "What problem would this solve?"
      description: "Describe what you're trying to do (in development or in a CI/CD pipeline) and what makes it hard today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "What would you like the CLI to do?"
      description: "For example the command and options you have in mind, and what it should output."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you've considered"
      description: "Workarounds or other tools you use today, if any."
