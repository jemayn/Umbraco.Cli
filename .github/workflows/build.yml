name: Build
run-name: Build ${{ github.ref_name }}

on:
  push:
    branches:
      - develop
      - v*/dev
      - release/*
      - main
      - v*/main
  pull_request:
    branches:
      - develop
      - v*/dev
      - release/*
  workflow_dispatch:
    inputs:
      sbom:
        description: Generate the SBOM (auto only does so for develop and v{major}/dev branches).
        required: true
        default: auto
        type: choice
        options:
          - auto
          - force
          - skip

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Avoid a shallow clone so nbgv can calculate the version height

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --filter "TestCategory!=Smoke" --report-trx --results-directory TestResults

      - name: Check trimming and AOT compatibility
        if: runner.os == 'Linux'
        run: dotnet publish src/Umbraco.Cli --configuration Release --runtime linux-x64 --self-contained -p:PublishTrimmed=true -p:PackAsTool=false -warnaserror --output artifacts/trimmed

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/Umbraco.Cli --configuration Release --no-build --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      - name: Upload package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    if: |
      inputs.sbom != 'skip' && (
        inputs.sbom == 'force' ||
        (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || (startsWith(github.ref, 'refs/heads/v') && endsWith(github.ref, '/dev'))))
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Avoid a shallow clone so nbgv can calculate the version height

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Nerdbank.GitVersioning
        id: nbgv
        uses: dotnet/nbgv@v0.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore

      - name: Generate and upload SBOM
        env:
          DEPENDENCY_TRACK_URL: ${{ vars.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          MAJOR_VERSION: ${{ steps.nbgv.outputs.VersionMajor }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom

          # Like Umbraco Deploy: skip (rather than fail) when Dependency-Track isn't configured
          if [ -z "$DEPENDENCY_TRACK_URL" ] || [ -z "$DEPENDENCY_TRACK_API_KEY" ]; then
            echo "::notice::Skipping the SBOM upload, because the DEPENDENCY_TRACK_URL variable or DEPENDENCY_TRACK_API_KEY secret is not configured."
            npx --yes @cyclonedx/cdxgen --recurse \
              --output artifacts/sbom/sbom.json \
              --spec-version 1.6 \
              --json-pretty \
              --project-group Umbraco \
              --project-name Umbraco.Cli \
              --project-version "v$MAJOR_VERSION"
            exit 0
          fi

          npx --yes @cyclonedx/cdxgen --recurse \
            --output artifacts/sbom/sbom.json \
            --spec-version 1.6 \
            --json-pretty \
            --project-group Umbraco \
            --project-name Umbraco.Cli \
            --project-version "v$MAJOR_VERSION" \
            --server-url "$DEPENDENCY_TRACK_URL" \
            --api-key "$DEPENDENCY_TRACK_API_KEY"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom
