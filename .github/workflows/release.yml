name: Release
run-name: Release ${{ github.event.release.tag_name || github.ref_name }}

# Publishing a GitHub release creates its release-{version} tag, which Nerdbank.GitVersioning treats as a public release.
# To publish again manually, run this workflow from the release tag (not a branch), so nbgv sees the tag as the current ref.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run this workflow from the release tag, not $REF."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -qE '^release-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a release tag of the form 'release-<major>.<minor>.<patch>[-<prerelease>]'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # Avoid a shallow clone so nbgv can calculate the version height

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Nerdbank.GitVersioning
        id: nbgv
        uses: dotnet/nbgv@v0.5.2

      - name: Check version
        env:
          PUBLIC_RELEASE: ${{ steps.nbgv.outputs.PublicRelease }}
          PACKAGE_VERSION: ${{ steps.nbgv.outputs.NuGetPackageVersion }}
        run: |
          if [ "$PUBLIC_RELEASE" != "True" ]; then
            echo "::error::Nerdbank.GitVersioning doesn't consider $TAG a public release."
            exit 1
          fi
          if [ "release-$PACKAGE_VERSION" != "$TAG" ]; then
            echo "::error::The package version $PACKAGE_VERSION doesn't match the tag $TAG."
            exit 1
          fi

      - name: Build
        run: dotnet build --configuration Release -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --filter "TestCategory!=Smoke"

      - name: Pack
        run: dotnet pack src/Umbraco.Cli --configuration Release --no-build --output artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: pack
    runs-on: ubuntu-latest
    environment: release # Requires a reviewer to approve the release
    permissions:
      id-token: write # For NuGet trusted publishing

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
